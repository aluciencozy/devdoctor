[package]
name = "devdoctor"
version = "0.1.0"
edition = "2024"
description = "A read-only terminal UI for inspecting developer processes, ports, and toolchains"
repository = "https://github.com/aluciencozy/devdoctor"
readme = "README.md"
license = "MIT"
keywords = ["cli", "tui", "processes", "ports", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
listeners = "0.6.1"
process_control = "5.2.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
sysinfo = "0.40.1"
thiserror = "2.0.21"
which = "8.0.6"
